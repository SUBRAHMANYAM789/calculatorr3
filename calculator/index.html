<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>JavaScript Calculator</h1>
        
        <div class="calculator">
            <div class="display">
                <input type="text" id="display" readonly value="0">
            </div>
            
            <div class="buttons">
                <!-- Row 1 -->
                <button class="btn function" onclick="clearDisplay()">C</button>
                <button class="btn function" onclick="deleteLast()">DEL</button>
                <button class="btn function" onclick="appendToDisplay('%')">%</button>
                <button class="btn operator" onclick="appendToDisplay('/')">÷</button>
                
                <!-- Row 2 -->
                <button class="btn number" onclick="appendToDisplay('7')">7</button>
                <button class="btn number" onclick="appendToDisplay('8')">8</button>
                <button class="btn number" onclick="appendToDisplay('9')">9</button>
                <button class="btn operator" onclick="appendToDisplay('*')">×</button>
                
                <!-- Row 3 -->
                <button class="btn number" onclick="appendToDisplay('4')">4</button>
                <button class="btn number" onclick="appendToDisplay('5')">5</button>
                <button class="btn number" onclick="appendToDisplay('6')">6</button>
                <button class="btn operator" onclick="appendToDisplay('-')">−</button>
                
                <!-- Row 4 -->
                <button class="btn number" onclick="appendToDisplay('1')">1</button>
                <button class="btn number" onclick="appendToDisplay('2')">2</button>
                <button class="btn number" onclick="appendToDisplay('3')">3</button>
                <button class="btn operator" onclick="appendToDisplay('+')">+</button>
                
                <!-- Row 5 -->
                <button class="btn number" onclick="appendToDisplay('0')">0</button>
                <button class="btn number" onclick="appendToDisplay('.')">.</button>
                <button class="btn equals" onclick="calculate()">=</button>
                <button class="btn function" onclick="appendToDisplay('**')">^</button>
            </div>
            
            <div class="advanced-functions">
                <h3>Advanced Functions</h3>
                <div class="function-grid">
                    <button class="btn-adv" onclick="applyFunction('sqrt')">√</button>
                    <button class="btn-adv" onclick="applyFunction('square')">x²</button>
                    <button class="btn-adv" onclick="applyFunction('cube')">x³</button>
                    <button class="btn-adv" onclick="applyFunction('factorial')">x!</button>
                    
                    <button class="btn-adv" onclick="applyFunction('sin')">sin</button>
                    <button class="btn-adv" onclick="applyFunction('cos')">cos</button>
                    <button class="btn-adv" onclick="applyFunction('tan')">tan</button>
                    <button class="btn-adv" onclick="applyFunction('log')">log</button>
                    
                    <button class="btn-adv" onclick="applyFunction('ln')">ln</button>
                    <button class="btn-adv" onclick="applyFunction('exp')">e^x</button>
                    <button class="btn-adv" onclick="applyFunction('abs')">|x|</button>
                    <button class="btn-adv" onclick="appendToDisplay('Math.PI')">π</button>
                </div>
            </div>
        </div>
        
        <div class="history">
            <h3>History</h3>
            <div id="history-list"></div>
            <button class="btn-clear-history" onclick="clearHistory()">Clear History</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
